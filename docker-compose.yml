services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./home-assistant:/config
    environment:
      - TZ=America/New_York

  backend:
    build: ./backend
    container_name: smartapartment-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    depends_on:
      - homeassistant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

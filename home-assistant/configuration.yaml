# Loads the rest of Home Assistant config from subdirectories.
default_config:

# automations/scenes are each a list of entries per file -> merge_list.
# scripts are each a named mapping per file -> merge_named.
automation: !include_dir_merge_list automations/
script: !include_dir_merge_named scripts/
scene: !include_dir_merge_list scenes/

# Calls the Java backend when Shelly button automations fire.
rest_command: !include rest_commands.yaml

# Optional: expose backend URL for templates (copy values into secrets.yaml).
# backend_url: !secret backend_url

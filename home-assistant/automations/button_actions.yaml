# Replace DEVICE_ID after pairing the Shelly BLU Button in Home Assistant.
# Easiest path: Settings → Automations → Create → Device → Shelly BLU Button
# and pick Single/Double/Triple/Long press, then set action to the matching
# rest_command below.

- id: smart_apartment_button_single
  alias: "Smart Apartment — Button Single Press"
  description: "Play Spotify playlist on Sonos"
  triggers:
    - trigger: device
      device_id: REPLACE_WITH_YOUR_DEVICE_ID
      domain: bthome
      type: button_1
      subtype: press
  conditions: []
  actions:
    - action: rest_command.smart_apartment_button_single
  mode: single

- id: smart_apartment_button_double
  alias: "Smart Apartment — Button Double Press"
  description: "Activate Hue relax scene"
  triggers:
    - trigger: device
      device_id: REPLACE_WITH_YOUR_DEVICE_ID
      domain: bthome
      type: button_1
      subtype: double_press
  conditions: []
  actions:
    - action: rest_command.smart_apartment_button_double
  mode: single

- id: smart_apartment_button_triple
  alias: "Smart Apartment — Button Triple Press"
  description: "Activate Hue party scene"
  triggers:
    - trigger: device
      device_id: REPLACE_WITH_YOUR_DEVICE_ID
      domain: bthome
      type: button_1
      subtype: triple_press
  conditions: []
  actions:
    - action: rest_command.smart_apartment_button_triple
  mode: single

- id: smart_apartment_button_long
  alias: "Smart Apartment — Button Long Press"
  description: "Welcome home greeting on Sonos"
  triggers:
    - trigger: device
      device_id: REPLACE_WITH_YOUR_DEVICE_ID
      domain: bthome
      type: button_1
      subtype: long_press
  conditions: []
  actions:
    - action: rest_command.smart_apartment_button_long
  mode: single
